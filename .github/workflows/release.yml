name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Verify, Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare versioned APK & SHA-256 checksum
        id: prepare
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          APK_NAME="aromantique-${TAG}.apk"
          OUT_DIR="build/app/outputs/flutter-apk"
          cp "${OUT_DIR}/app-release.apk" "${OUT_DIR}/${APK_NAME}"
          SHA256=$(sha256sum "${OUT_DIR}/${APK_NAME}" | awk '{print $1}')
          SIZE=$(du -h "${OUT_DIR}/${APK_NAME}" | awk '{print $1}')
          echo "${SHA256}  ${APK_NAME}" > "${OUT_DIR}/${APK_NAME}.sha256"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT_DIR}/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_path=${OUT_DIR}/${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Aromantique ${{ steps.prepare.outputs.tag }} — L'Art du Sillage
          generate_release_notes: true
          body: |
            ## AROMANTIQUE `${{ steps.prepare.outputs.tag }}` — *L'Art du Sillage*

            Automated release build verified with `flutter analyze` and `flutter test`.

            ### Download & Verify
            - **Android APK (Universal)**: `${{ steps.prepare.outputs.apk_name }}` (`${{ steps.prepare.outputs.apk_size }}`)
            - **SHA-256**: `${{ steps.prepare.outputs.sha256 }}`
          files: |
            ${{ steps.prepare.outputs.apk_path }}
            ${{ steps.prepare.outputs.sha_path }}
