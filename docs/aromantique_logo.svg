<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F3F6F7"/>
      <stop offset="100%" stop-color="#D9E4E5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#121518" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Emblem Frame -->
  <rect x="10" y="8" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#D9E4E5" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="16" y="14" width="108" height="108" rx="25" fill="none" stroke="#5D7276" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Aromantique Ornate Perfume-Drop Emblem (100x100 scaled & centered) -->
  <g transform="translate(26, 24) scale(0.88)" stroke="#121518" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top stopper dot -->
    <circle cx="50" cy="14" r="5.5" fill="#121518" stroke="none"/>
    <!-- Neck ring -->
    <rect x="38" y="21" width="24" height="8" rx="4"/>
    <!-- Outer petal / bottle silhouette -->
    <path d="M 50 30 C 86 36, 90 72, 50 90 C 10 72, 14 36, 50 30 Z"/>
    <!-- Inner lotus drop -->
    <path d="M 50 42 C 68 50, 70 72, 50 84 C 30 72, 32 50, 50 42 Z"/>
    <!-- Left & right side leaf arcs -->
    <path d="M 50 86 Q 24 74 26 56"/>
    <path d="M 50 86 Q 76 74 74 56"/>
  </g>
</svg>
